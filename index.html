<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Tareas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'DynaPuff', cursive, sans-serif;
      }

      @keyframes tiltBounce {
        0% {
          transform: scale(1) rotate(-7deg);
        }
        50% {
          transform: scale(1.5) rotate(-7deg);
        }
        100% {
          transform: scale(1.15) rotate(-7deg);
        }
      }

      @keyframes tiltBounceAlt {
        0% {
          transform: scale(1) rotate(7deg);
        }
        50% {
          transform: scale(1.5) rotate(7deg);
        }
        100% {
          transform: scale(1.15) rotate(7deg);
        }
      }

      @keyframes jelly {
        0% {
          transform: scale(1.25, 1) skewX(20deg) translateY(3px) rotateX(40deg) rotateY(10deg) rotateZ(-10deg);
        }
        50% {
          transform: scale(1.25, 1.1) skewX(-15deg) translateY(-2px);
        }
        100% {
          transform: scale(1.25, 1) skewX(20deg) translateY(3px) rotateX(-40deg) rotateY(-10deg) rotateZ(-15deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
